<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผนที่บ้านนักเรียน — โรงเรียนบ้านใหม่</title>
<meta name="theme-color" content="#0288D1">
<script src="js/tt-theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tt-common.css">
<link rel="stylesheet" href="css/tt-dark.css">
<link rel="stylesheet" href="css/geo.css">
<style>
  .gm-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .gm-bar .form-control { flex:1; min-width:160px; }
  .gm-bar .btn { margin:0; }
  #gm-map { height:62vh; min-height:360px; border-radius:14px; overflow:hidden; border:1px solid var(--border); }
  #gm-map.picking { cursor:crosshair; }
  .gm-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:12px; }
  .gm-stats .stat .value { font-size:22px; }
  .gm-band { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .gm-band span { padding:3px 10px; border-radius:999px; font-size:13px; font-weight:600; background:var(--primary-light); color:var(--primary-dark); }
  .gm-list tbody tr { cursor:pointer; }
  .gm-list tbody tr:hover { background:var(--primary-light); }
  .gm-list select.form-control { padding:4px 6px; font-size:13px; min-width:150px; }
  .gm-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:0; }
  .gm-legend { display:flex; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-top:8px; }
  .gm-tabs { margin-bottom:0; }
  .gm-pick-hint { background:#FFF8E1; color:#8D6E00; padding:8px 12px; border-radius:10px; font-size:14px; margin-top:8px; }
  .geo-hazard { font-size:22px; line-height:1; text-align:center; filter:drop-shadow(0 1px 2px rgba(0,0,0,.4)); background:none; border:0; }
  .geo-stop { background:#0277BD; color:#fff; border-radius:50%; width:24px; height:24px; line-height:24px; text-align:center; font-weight:700; font-size:13px; border:2px solid #fff; }
  .gm-mode-table td, .gm-mode-table th { text-align:center; }
  .gm-mode-table td:first-child, .gm-mode-table th:first-child { text-align:left; }
  .gm-qr { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
  html[data-theme="dark"] .gm-pick-hint { background:#3A2E12; color:#FFE082; }
</style>
</head>
<body data-tt-page="geo" class="geo-page">

<header class="app-header">
  <a href="index.html" class="back">‹</a>
  <span class="logo">🗺️</span>
  <div>
    <div class="title">แผนที่บ้านนักเรียน</div>
    <div style="font-size:13px;opacity:.9" id="gm-sub">เฉพาะบุคลากร · ต้องเข้าสู่ระบบ</div>
  </div>
</header>

<main class="container">
  <div class="card">
    <div class="gm-bar">
      <select class="form-control" id="gm-class"></select>
      <input class="form-control" id="gm-find" list="gm-names" placeholder="ค้นหานักเรียน (ชื่อ/รหัส)">
      <datalist id="gm-names"></datalist>
    </div>
    <div class="gm-bar" style="margin-top:8px">
      <label class="tt-chip"><input type="checkbox" id="gm-rings" checked> วงรัศมี</label>
      <label class="tt-chip"><input type="checkbox" id="gm-labels"> ชื่อบนหมุด</label>
      <label class="tt-chip"><input type="checkbox" id="gm-hazards" checked> ⚠️ จุดเสี่ยง</label>
      <label class="tt-chip"><input type="checkbox" id="gm-heat"> 🔥 ความหนาแน่น</label>
      <label class="tt-chip"><input type="checkbox" id="gm-groups"> 🏘️ กลุ่มบ้าน</label>
    </div>
    <div class="gm-bar" style="margin-top:8px" id="gm-actions"></div>
    <div id="gm-scope"></div>
    <div id="gm-noschool"></div>
    <div class="gm-stats" id="gm-stats"></div>
    <div class="gm-band" id="gm-band"></div>
  </div>
  <div class="card" style="padding:10px"><div id="gm-map"></div><div id="gm-pick"></div><div class="gm-legend" id="gm-legend"></div></div>

  <div class="tabs gm-tabs" id="gm-tabs">
    <button class="tab active" data-tab="list">📋 รายชื่อ</button>
    <button class="tab" data-tab="travel">🚸 วิธีเดินทาง</button>
    <button class="tab" data-tab="far">📏 บ้านไกล</button>
    <button class="tab" data-tab="groups">🏘️ กลุ่มบ้าน / รถรับส่ง</button>
    <button class="tab" data-tab="hazards">⚠️ จุดเสี่ยง</button>
  </div>
  <section class="card gm-pane" id="gm-pane-list"></section>
  <section class="card gm-pane hidden" id="gm-pane-travel"></section>
  <section class="card gm-pane hidden" id="gm-pane-far"></section>
  <section class="card gm-pane hidden" id="gm-pane-groups"></section>
  <section class="card gm-pane hidden" id="gm-pane-hazards"></section>
  <p class="tt-note">ระยะ/เวลา "≈" เป็นค่าประมาณ (เส้นตรง × ตัวคูณถนน ÷ ความเร็วเฉลี่ย) · ค่าที่ไม่มี ≈ คำนวณตามถนนจริงจาก OpenStreetMap แล้ว (ส่งเฉพาะพิกัด 2 จุด ไม่ส่งชื่อ)</p>
</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/utils.js"></script>
<script src="js/tt-i18n.js"></script>
<script src="js/tt-session.js"></script>
<script src="js/geo.js"></script>
<script src="js/modules/student-map.js"></script>
</body>
</html>
