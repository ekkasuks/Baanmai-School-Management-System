<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายงานการมาเรียนรายเดือน — โรงเรียนบ้านใหม่</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .sum-table th, .sum-table td { text-align:center; padding:7px 9px; white-space:nowrap; }
  .sum-table th:first-child, .sum-table td:first-child { text-align:left; }
  .sum-table tfoot td { font-weight:700; border-top:2px solid var(--border); background:#FAFEFF; }
  .sum-table .grp-a { background:#E8F5E9; } .sum-table .grp-b { background:#FFF3E0; }
  .rate-hi { color:var(--green-dark); font-weight:700; }
  .rate-mid { color:#EF6C00; font-weight:700; }
  .rate-lo { color:#C62828; font-weight:700; }
  .toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
</style>
</head>
<body>

<header class="app-header">
  <a href="index.html" class="back">‹</a>
  <span class="logo">📊</span>
  <div>
    <div class="title">รายงานการมาเรียนรายเดือน</div>
    <div style="font-size:13px;opacity:.9">สรุปรายชั้น · รายคน</div>
  </div>
</header>

<main class="container">

  <!-- แถบเลือกเดือน (ใช้ร่วมทั้ง 2 แท็บ) -->
  <div class="card toolbar">
    <label style="margin:0">🗓️ เดือน</label>
    <select class="form-control" id="r-month" style="max-width:220px"></select>
    <span id="r-info" class="text-muted" style="font-size:14px"></span>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="class">🏫 รายชั้น</button>
    <button class="tab" data-tab="student">👧 รายคน</button>
  </div>

  <!-- ── รายชั้น ── -->
  <section class="tab-pane" id="tab-class">
    <div class="card">
      <div class="toolbar" style="justify-content:space-between;margin-bottom:12px">
        <h3 class="card-title" style="margin:0">🏫 สรุปรายชั้น</h3>
        <button class="btn btn-danger" id="c-pdf"><i class="bi bi-filetype-pdf"></i> Export PDF</button>
      </div>
      <div id="c-result" class="text-muted">กำลังโหลด...</div>
    </div>
  </section>

  <!-- ── รายคน ── -->
  <section class="tab-pane hidden" id="tab-student">
    <div class="card">
      <div class="toolbar" style="justify-content:space-between;margin-bottom:12px">
        <div class="toolbar">
          <label style="margin:0">ชั้น/ห้อง</label>
          <select class="form-control" id="st-class" style="max-width:260px"><option value="">— เลือกชั้น —</option></select>
        </div>
        <button class="btn btn-danger" id="st-pdf"><i class="bi bi-filetype-pdf"></i> Export PDF</button>
      </div>
      <div id="st-result" class="text-muted">เลือกชั้นเพื่อแสดงรายงานรายคน</div>
    </div>
  </section>

  <div class="text-muted" style="font-size:13px;margin-bottom:24px">
    หมายเหตุ: <strong>มาโรงเรียน</strong> = มา + สาย · <strong>อัตรา</strong> = มาโรงเรียน ÷ จำนวนวันที่บันทึก × 100
  </div>

</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/utils.js"></script>
<script src="js/pdf.js"></script>
<script src="js/modules/attendance-report.js"></script>
</body>
</html>
